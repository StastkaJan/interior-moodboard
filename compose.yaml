name: interior-moodboard

services:
  setup:
    image: node:24-bookworm-slim
    profiles: ["tools"]
    working_dir: /workspace
    volumes:
      - .:/workspace

  web:
    image: node:24-bookworm-slim
    init: true
    working_dir: /app
    ports:
      - "127.0.0.1:${APP_PORT:-5175}:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    volumes:
      - type: bind
        source: ./app
        target: /app
        bind:
          create_host_path: false
      - node_modules:/app/node_modules
    command:
      - sh
      - -c
      - npm ci && exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort

  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: ["tools"]
    init: true
    ipc: host
    working_dir: /app
    environment:
      E2E_PRODUCTION: ${E2E_PRODUCTION:-0}
    volumes:
      - type: bind
        source: ./app
        target: /app
        bind:
          create_host_path: false
      - e2e_node_modules:/app/node_modules
    command: ["sh", "-c", "npm ci && exec npm run test:e2e"]

volumes:
  node_modules:
  e2e_node_modules:
